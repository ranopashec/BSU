<div id='D1' style='border: solid red 1px'>элемент 1...</div> 

<script>
window.onload = function() {
    // 1. Добавить строку в div с id='D1'
    const d1 = document.getElementById('D1');
    d1.innerHTML += '<br>добавлена новая строка';

    // 2. Создать и добавить новый div с текстом "строка 2"
    const newDiv = document.createElement('div');
    newDiv.textContent = 'строка 2';
    document.body.appendChild(newDiv);
};
</script>
